name: publish-staging

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - premajor
          - preminor
          - prepatch
          - prerelease

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - name: Update .npmrc
        run: |
          echo "@fafo-test-org:registry=https://npm.pkg.github.com" >> ~/.npmrc
        # Use staging environment packages for test
      - run: npm ci
      - run: npm test

  publish:
    needs: test # Don't publish without passing tests
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Make sure the value of GITHUB_TOKEN will not be persisted in repo's config
          persist-credentials: false
      - name: Setup Git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://npm.pkg.github.com'
      - name: Update .npmrc
        run: |
          echo "@fafo-test-org:registry=https://npm.pkg.github.com" >> ~/.npmrc
        # Use staging environment packages for staging deploy
      - run: npm ci
      - name: Bump version
        run: npm version --preid next ${{ inputs.version_bump }}
      - name: Push with tags
        run: git push --follow-tags
      - run: npm publish --registry https://npm.pkg.github.com --tag next
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
