name: publish-staging

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - premajor
          - preminor
          - prepatch
          - prerelease

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Update .npmrc
        run: |
          echo "@fafo-test-org:registry=https://npm.pkg.github.com" >> ~/.npmrc
        # Use staging environment packages for test
      - run: npm ci
      - run: npm test

  publish:
    needs: test # Don't publish without passing tests
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Update .npmrc
        run: |
          echo "@fafo-test-org:registry=https://npm.pkg.github.com" >> ~/.npmrc
        # Use staging environment packages for staging deploy
      - run: npm ci
      - name: Bump version
        run: npm --preid rc ${{ inputs.version_bump }}
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
